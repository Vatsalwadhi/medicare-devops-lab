# Only MediCare+ web pods may reach the database (zero-trust east-west traffic)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-allow-web-only
  namespace: medicare
spec:
  podSelector:
    matchLabels: {app: postgres}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels: {tier: web}
      ports:
        - {protocol: TCP, port: 5432}
