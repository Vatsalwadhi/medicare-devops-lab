# Experiment 1: MediCare+ web application (rolling update deployment)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: medicare-web
  namespace: medicare
  labels: {app: medicare-web}
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app: medicare-web}
  template:
    metadata:
      labels: {app: medicare-web, tier: web}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: web
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          ports: [{containerPort: 8000}]
          envFrom:
            - secretRef: {name: medicare-secrets}
          env:
            - {name: APP_VERSION, value: VERSION_PLACEHOLDER}
            - {name: DEPLOY_COLOR, value: "none"}
          readinessProbe:
            httpGet: {path: /api/health, port: 8000}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /api/health, port: 8000}
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 384Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: medicare-web
  namespace: medicare
spec:
  type: NodePort
  selector: {app: medicare-web}
  ports:
    - {port: 80, targetPort: 8000, nodePort: 30080}
